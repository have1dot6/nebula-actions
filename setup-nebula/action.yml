name: 'Nebula Setup'
description: 'Set up Node.js, pnpm, and dependencies.'

inputs:
  registry:
    description: 'Private npm registry URL. Defaults to GitHub Packages.'
    required: false
    default: 'https://npm.pkg.github.com'
  github-token:
    description: GitHub token
    required: true
  registry-token:
    description: 'Token sent as NODE_AUTH_TOKEN for the private registry. Defaults to inputs.github-token.'
    required: false
  cli-version:
    description: '@zeniein/nebula-pack-cli version to install (via npx). Keep in sync with the published package version (packages/pack-cli/package.json).'
    required: false
    default: '1.0.1'
  node-version:
    description: 'Node.js version used for setup-node.'
    required: false
    default: '24'
  pnpm-version:
    description: 'pnpm version used for setup-node.'
    required: false
    default: '10.8.0'
  run-init:
    description: 'Run `nebula-pack init` after auth setup. Set to "false" when nebula.config.ts already exists.'
    required: false
    default: 'true'
  working-directory:
    description: 'Directory in which to write nebula.config.ts (init runs here).'
    required: false
    default: '.'

outputs:
  init-outcome:
    description: 'Outcome of the init step (success / skipped / failure). Always "skipped" when run-init is "false".'
    value: ${{ steps.init.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js with private registry auth
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
    
    
    - name: Install Nebula Pack CLI
      shell: bash
      run: |
        echo "Installing @zeniein/nebula-pack-cli@${{ inputs.cli-version }}"
        npm install -g @zeniein/nebula-pack-cli@${{ inputs.cli-version }}

    - name: Run nebula-pack init
      id: init
      if: inputs.run-init == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
      run: |
        nebula-pack init
